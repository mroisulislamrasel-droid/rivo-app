<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rivo Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#07080d;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:20px}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#11131a;border:1px solid #282b35;border-radius:16px;padding:15px;margin:12px 0}.input{width:100%;box-sizing:border-box;background:#191b22;color:#fff;border:1px solid #30333e;border-radius:10px;padding:10px;margin:5px 0}.btn{background:#ff2f86;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800}.ok{background:#19c96b}.bad{background:#e54b4b}.muted{color:#9a9daa;font-size:13px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #2a2d37;text-align:left;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto}}
</style></head><body><div class="wrap">
<div class="bar"><h1>Rivo Admin Panel</h1><button class="btn bad" onclick="logout()">Logout</button></div>
<div id="login"><div class="card"><h2>Admin Login</h2><input id="email" class="input" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p class="muted">Admin access database role='admin' দিয়ে সুরক্ষিত।</p></div></div>
<div id="panel" style="display:none">
<div class="grid"><div class="card"><small>Users</small><h2 id="uCount">0</h2></div><div class="card"><small>Videos</small><h2 id="vCount">0</h2></div><div class="card"><small>Pending</small><h2 id="pCount">0</h2></div><div class="card"><small>Withdrawals</small><h2 id="wCount">0</h2></div></div>
<div class="card"><h2>Notice Board</h2><input id="nt" class="input" placeholder="Notice title"><textarea id="nb" class="input" placeholder="Notice message"></textarea><button class="btn" onclick="addNotice()">Publish Notice</button><div id="notices"></div></div>
<div class="card"><h2>Rules / Guide</h2><input id="gt" class="input" placeholder="Guide title"><textarea id="gb" class="input" placeholder="Guide text"></textarea><button class="btn" onclick="addGuide()">Add Guide</button><div id="guides"></div></div>
<div class="card"><h2>Earning Rule</h2><div class="row"><input id="rate" class="input" type="number" step="0.01" placeholder="৳ per 1000 views"><input id="min" class="input" type="number" step="1" placeholder="Minimum withdraw"><button class="btn" onclick="saveSettings()">Save</button></div></div>
<div class="card"><h2>Users</h2><div id="users"></div></div>
<div class="card"><h2>Videos</h2><div id="videos"></div></div>
<div class="card"><h2>Withdrawal Requests</h2><div id="withdrawals"></div></div>
</div></div>
<script>
const sb=supabase.createClient("https://ayoactrisfcdhmhsnrwz.supabase.co","sb_publishable_pvPMH5zhPX3_vjarFMrYtw_9uZkagYX");let me=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});if(error)return alert(error.message);me=data.user;await boot()}
async function boot(){const {data:p}=await sb.from('profiles').select('*').eq('id',me.id).single();if(p?.role!=='admin'){await sb.auth.signOut();return alert('এই account Admin নয়। SQL দিয়ে role=admin করুন।')}document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';refresh()}
async function refresh(){const [u,v,w,n,g,s]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('videos').select('*,profiles(username,email)').order('created_at',{ascending:false}),sb.from('withdrawals').select('*,profiles(username,email)').order('created_at',{ascending:false}),sb.from('notices').select('*').order('created_at',{ascending:false}),sb.from('guides').select('*').order('sort_order'),sb.from('app_settings').select('*').eq('id',1).single()]);document.getElementById('uCount').textContent=u.data?.length||0;document.getElementById('vCount').textContent=v.data?.length||0;document.getElementById('pCount').textContent=(v.data||[]).filter(x=>x.status==='pending').length;document.getElementById('wCount').textContent=(w.data||[]).filter(x=>x.status==='pending').length;document.getElementById('rate').value=s.data?.rate_per_1000_views||10;document.getElementById('min').value=s.data?.minimum_withdraw||100;
document.getElementById('users').innerHTML=(u.data||[]).map(x=>`<div class="card"><b>${esc(x.username||x.email)}</b><div class="muted">${esc(x.email)} • role: ${esc(x.role)}</div></div>`).join('');
document.getElementById('videos').innerHTML=(v.data||[]).map(x=>`<div class="card"><div><b>@${esc(x.profiles?.username||'user')}</b> • ${x.media_type} • ${x.views} views • <b>${x.status}</b></div><div class="muted">${esc(x.caption)}</div><a href="${x.media_url}" target="_blank">Open media</a><div class="row" style="margin-top:8px">${x.status==='pending'?`<button class="btn ok" onclick="moderate('${x.id}','approved')">Approve</button><button class="btn bad" onclick="moderate('${x.id}','rejected')">Reject</button>`:''}<button class="btn" onclick="deleteVideo('${x.id}')">Delete</button></div></div>`).join('');
document.getElementById('withdrawals').innerHTML=(w.data||[]).map(x=>`<div class="card"><b>${esc(x.method)} ৳${x.amount}</b><div>${esc(x.profiles?.username||'user')} • ${esc(x.account_number)} • ${x.status}</div>${x.status==='pending'?`<div class="row" style="margin-top:8px"><button class="btn ok" onclick="pay('${x.id}')">Mark Paid</button><button class="btn bad" onclick="rejectPay('${x.id}')">Reject</button></div>`:''}</div>`).join('');
document.getElementById('notices').innerHTML=(n.data||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="muted">${esc(x.body)}</div><button class="btn bad" onclick="del('notices',${x.id})">Delete</button></div>`).join('');
document.getElementById('guides').innerHTML=(g.data||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="muted">${esc(x.body)}</div><button class="btn bad" onclick="del('guides',${x.id})">Delete</button></div>`).join('');
}
async function addNotice(){const {error}=await sb.from('notices').insert({title:nt.value.trim(),body:nb.value.trim()});if(error)return alert(error.message);nt.value='';nb.value='';refresh()}
async function addGuide(){const {error}=await sb.from('guides').insert({title:gt.value.trim(),body:gb.value.trim(),sort_order:99});if(error)return alert(error.message);gt.value='';gb.value='';refresh()}
async function saveSettings(){const {error}=await sb.from('app_settings').update({rate_per_1000_views:Number(rate.value),minimum_withdraw:Number(min.value),updated_at:new Date().toISOString()}).eq('id',1);if(error)return alert(error.message);alert('Saved');refresh()}
async function moderate(id,status){const {error}=await sb.from('videos').update({status}).eq('id',id);if(error)return alert(error.message);refresh()}
async function deleteVideo(id){if(!confirm('Delete video?'))return;const {error}=await sb.from('videos').delete().eq('id',id);if(error)return alert(error.message);refresh()}
async function pay(id){const {error}=await sb.from('withdrawals').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);refresh()}
async function rejectPay(id){const {error}=await sb.from('withdrawals').update({status:'rejected'}).eq('id',id);if(error)return alert(error.message);refresh()}
async function del(table,id){const {error}=await sb.from(table).delete().eq('id',id);if(error)return alert(error.message);refresh()}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.getUser().then(r=>{if(r.data.user){me=r.data.user;boot()}})
</script></body></html>
