<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rivo Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#07080d;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#11131a;border:1px solid #292c37;border-radius:16px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.input{width:100%;box-sizing:border-box;background:#191b22;color:#fff;border:1px solid #30333e;border-radius:10px;padding:10px;margin:5px 0}.btn{background:#ff2f86;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800}.ok{background:#28d67d;color:#06130b}.bad{background:#e64d59}.muted{color:#9b9eaa;font-size:13px;line-height:1.5}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{background:#191b22;color:#aaa;border:0;border-radius:10px;padding:10px}.tab.on{background:#ff2f86;color:#fff}.section{display:none}.section.on{display:block}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}video,img.media{max-width:100%;max-height:330px;border-radius:12px;background:#000}.pill{padding:4px 8px;border-radius:8px;background:#252832;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<div class="row"><div class="grow"><h1>Rivo Admin</h1><div class="muted">শুধু Admin account থেকে নিয়ন্ত্রণ করুন</div></div><button class="btn bad" onclick="logout()">Logout</button></div>
<div id="login" class="card"><h2>Admin Login</h2><input id="email" class="input" type="email" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button></div>
<div id="panel" style="display:none">
<div class="grid"><div class="card"><div class="muted">Users</div><h2 id="users">0</h2></div><div class="card"><div class="muted">Videos</div><h2 id="videos">0</h2></div><div class="card"><div class="muted">Monetization</div><h2 id="mons">0</h2></div><div class="card"><div class="muted">Ads</div><h2 id="ads">0</h2></div></div>
<div class="tabs"><button class="tab on" data-s="dashboard">Dashboard</button><button class="tab" data-s="video">Videos</button><button class="tab" data-s="ad">Ads</button><button class="tab" data-s="content">Notice/Rules</button><button class="tab" data-s="settings">Settings</button><button class="tab" data-s="pay">Payments</button></div>
<section id="dashboard" class="section on"><div class="card"><h2>Pending Videos</h2><div id="dashVideos"></div></div></section>
<section id="video" class="section"><div class="card"><h2>Video Review</h2><div id="videoList"></div></div></section>
<section id="ad" class="section"><div class="card"><h2>Sponsor Ads</h2><div id="adList"></div></div></section>
<section id="content" class="section"><div class="card"><h2>Notice Board</h2><input id="nt" class="input" placeholder="Title"><textarea id="nb" class="input" rows="4" placeholder="Message"></textarea><button class="btn" onclick="addNotice()">Publish Notice</button></div><div class="card"><h2>Rules</h2><input id="gt" class="input" placeholder="Guide title"><textarea id="gb" class="input" rows="5" placeholder="Rule text"></textarea><input id="gs" class="input" type="number" value="50"><button class="btn" onclick="addGuide()">Add Rule</button></div></section>
<section id="settings" class="section"><div class="card"><h2>App Settings</h2><input id="rate" class="input" placeholder="earning_rate_per_1000_views"><input id="minFollowers" class="input" placeholder="monetization_min_followers"><input id="minViews" class="input" placeholder="monetization_min_views"><input id="p3" class="input" placeholder="sponsor_price_3"><input id="p7" class="input" placeholder="sponsor_price_7"><input id="p15" class="input" placeholder="sponsor_price_15"><input id="p30" class="input" placeholder="sponsor_price_30"><input id="adEvery" class="input" placeholder="sponsor_interstitial_every"><input id="wa" class="input" value="01742-361967"><button class="btn" onclick="saveSettings()">Save</button></div></section>
<section id="pay" class="section"><div class="card"><h2>Withdrawal Requests</h2><div id="payList"></div></div></section>
</div></div>
<script>
const sb=supabase.createClient('https://ayoactrisfcdhmhsnrwz.supabase.co','sb_publishable_pvPMH5zhPX3_vjarFMrYtw_9uZkagYX');let me=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)return alert(r.error.message);me=r.data.user;boot()}
async function boot(){const r=await sb.rpc('is_admin');if(!r.data)return alert('এই account Admin নয়');login.style.display='none';panel.style.display='block';load()}
async function logout(){await sb.auth.signOut();location.reload()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.s).classList.add('on')});
async function load(){const [u,v,m,a,p]=await Promise.all([sb.from('profiles').select('*',{count:'exact',head:true}),sb.from('videos').select('*').order('created_at',{ascending:false}),sb.from('monetization_applications').select('*').eq('status','pending'),sb.from('sponsored_ads').select('*').order('created_at',{ascending:false}),sb.from('payout_requests').select('*').order('created_at',{ascending:false})]);users.textContent=u.count||0;videos.textContent=(v.data||[]).length;mons.textContent=(m.data||[]).length;ads.textContent=(a.data||[]).length;renderVideos(v.data||[]);renderAds(a.data||[]);payList.innerHTML=(p.data||[]).map(x=>`<div class="card"><b>${Number(x.amount).toFixed(2)} BDT</b><div class="muted">${esc(x.payment_method)} · ${esc(x.payment_account)} · ${esc(x.status)}</div></div>`).join('')||'No requests';loadSettings()}
function renderVideos(list){const html=list.map(x=>`<div class="card"><div class="row"><div class="grow"><b>${esc(x.caption||'No caption')}</b><div class="muted">${esc(x.media_type)} · views ${Number(x.views_count||0)} · moderation ${esc(x.moderation_status)}</div><div class="muted">AI ${esc(x.content_check_status)} · copyright ${esc(x.copyright_check_status)} · fake-view ${esc(x.fake_view_status)}</div></div></div>${x.media_type==='photo'||x.media_type==='image'?`<img class="media" src="${esc(x.media_url)}">`:`<video class="media" src="${esc(x.media_url)}" controls muted playsinline></video>`}<div style="margin-top:10px"><button class="btn ok" onclick="approve('${x.id}')">Approve</button> <button class="btn bad" onclick="block('${x.id}')">Block</button></div></div>`).join('')||'<div class="muted">No videos</div>';videoList.innerHTML=html;dashVideos.innerHTML=list.filter(x=>x.moderation_status!=='approved').map(x=>`<div class="card">${esc(x.caption||'Pending video')} · ${esc(x.moderation_status)}</div>`).join('')||'<div class="muted">No pending videos</div>'}
async function approve(id){const r=await sb.rpc('rivo_admin_approve_video',{p_video_id:id,p_note:'Approved by admin'});if(r.error)return alert(r.error.message);load()}async function block(id){const r=await sb.rpc('rivo_admin_block_video',{p_video_id:id,p_note:'Blocked by admin'});if(r.error)return alert(r.error.message);load()}
function renderAds(list){adList.innerHTML=list.map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="muted">${esc(x.advertiser_name)} · ${esc(x.advertiser_whatsapp||'01742-361967')} · ${x.duration_days} days · ৳${Number(x.price||0)}</div><div class="muted">Payment: ${esc(x.payment_status)} · Status: ${esc(x.status)}</div>${x.status==='pending'?`<button class="btn ok" onclick="approveAd('${x.id}')">Approve</button> <button class="btn bad" onclick="rejectAd('${x.id}')">Reject</button>`:''}</div>`).join('')||'<div class="muted">No ads</div>'}
async function approveAd(id){const r=await sb.from('sponsored_ads').update({status:'approved',payment_status:'paid',starts_at:new Date().toISOString(),ends_at:new Date(Date.now()+30*86400000).toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function rejectAd(id){const r=await sb.from('sponsored_ads').update({status:'rejected'}).eq('id',id);if(r.error)alert(r.error.message);else load()}
async function addNotice(){const r=await sb.from('notices').insert({title:nt.value.trim(),message:nb.value.trim(),notice_type:'offer',is_active:true});if(r.error)alert(r.error.message);else{nt.value='';nb.value='';alert('Notice published')}}
async function addGuide(){const r=await sb.from('guides').insert({title:gt.value.trim(),body:gb.value.trim(),sort_order:Number(gs.value||50),is_active:true});if(r.error)alert(r.error.message);else{gt.value='';gb.value='';alert('Rule added')}}
async function loadSettings(){const {data}=await sb.from('app_settings').select('key,value');const s=Object.fromEntries((data||[]).map(x=>[x.key,x.value]));rate.value=s.earning_rate_per_1000_views||1;minFollowers.value=s.monetization_min_followers||1000;minViews.value=s.monetization_min_views||10000000;p3.value=s.sponsor_price_3||0;p7.value=s.sponsor_price_7||0;p15.value=s.sponsor_price_15||0;p30.value=s.sponsor_price_30||0;adEvery.value=s.sponsor_interstitial_every||5;wa.value=s.sponsor_whatsapp||'01742-361967'}
async function saveSettings(){const arr=[['earning_rate_per_1000_views',rate.value],['monetization_min_followers',minFollowers.value],['monetization_min_views',minViews.value],['sponsor_price_3',p3.value],['sponsor_price_7',p7.value],['sponsor_price_15',p15.value],['sponsor_price_30',p30.value],['sponsor_interstitial_every',adEvery.value],['sponsor_whatsapp',wa.value]];for(const [key,value] of arr){const r=await sb.from('app_settings').upsert({key,value:String(value),updated_at:new Date().toISOString()});if(r.error)return alert(r.error.message)}alert('Settings saved')}
sb.auth.getUser().then(r=>{if(r.data.user){me=r.data.user;boot()}})
</script></body></html>
