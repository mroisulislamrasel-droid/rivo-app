<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rivo Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900;background:linear-gradient(90deg,#fff,#ff3987,#8d6dff);-webkit-background-clip:text;color:transparent}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:#141720;border:1px solid #292d38;border-radius:14px;padding:16px}.card strong{font-size:25px;display:block;margin-top:7px}.muted{color:#858894;font-size:12px}button,input{font:inherit}.btn{background:#ff367f;color:#fff;border:0;border-radius:9px;padding:9px 12px}.table{background:#11131a;border:1px solid #292d38;border-radius:14px;overflow:auto}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.2fr;min-width:700px;padding:13px;border-bottom:1px solid #232630;gap:10px;align-items:center}.rate{width:110px;background:#181b24;color:#fff;border:1px solid #343844;border-radius:8px;padding:7px}.pill{font-size:10px;background:#1c2029;padding:5px 8px;border-radius:20px}.ok{color:#37e477}.warn{color:#ffcc54}</style></head>
<body><div class="wrap"><div class="head"><div class="logo">Rivo Admin</div><div class="muted">Creator & Payment Control</div></div>
<div class="cards"><div class="card"><div class="muted">Users</div><strong id="users">0</strong></div><div class="card"><div class="muted">Videos</div><strong id="videos">0</strong></div><div class="card"><div class="muted">Views</div><strong id="views">0</strong></div><div class="card"><div class="muted">Pending payouts</div><strong>৳0</strong></div></div>
<div class="card"><h3>Global earning rate</h3><p class="muted">Set how much you pay per 1,000 views. Production version should store this in Supabase.</p><input id="globalRate" class="rate" type="number" step=".01" value="1"> <button class="btn" onclick="setRate()">Save rate</button></div>
<h3>Creators / Videos</h3><div class="table"><div class="row"><b>User</b><b>Video</b><b>Views</b><b>Rate / 1K</b><b>Action</b></div><div id="rows"></div></div></div>
<script>
let data=JSON.parse(localStorage.getItem("rivo_v3")||"null")||{profile:{username:"demo"},videos:[],rate:1};
function render(){let vs=data.videos||[];document.getElementById("users").textContent=1;document.getElementById("videos").textContent=vs.length;document.getElementById("views").textContent=vs.reduce((a,v)=>a+(v.views||0),0);document.getElementById("globalRate").value=data.rate||1;document.getElementById("rows").innerHTML=vs.map((v,i)=>`<div class="row"><b>@${v.user||"user"}</b><span>${v.caption||"Untitled"}</span><span>${v.views||0}</span><input class="rate" id="r${i}" value="${v.rate||data.rate||1}"><button class="btn" onclick="approve(${i})">Approve / Pay</button></div>`).join("")||'<div class="row"><span class="muted">No creator videos yet</span></div>'}
function setRate(){data.rate=Number(document.getElementById("globalRate").value)||0;data.videos.forEach(v=>v.rate=data.rate);localStorage.setItem("rivo_v3",JSON.stringify(data));render()}
function approve(i){let r=Number(document.getElementById("r"+i).value)||0;data.videos[i].rate=r;localStorage.setItem("rivo_v3",JSON.stringify(data));alert("Approved. In the real production app this action must call a secure server-side payout function.")}
render();
</script></body></html>
