<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivo Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07080d;--card:#11131a;--line:#292c37;--muted:#9699a6;--pink:#ff2f86;--green:#20d477;--red:#ed5964;--gold:#f2b94b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-size:30px;font-weight:950}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.metric b{font-size:25px}.input{width:100%;box-sizing:border-box;background:#191b22;color:#fff;border:1px solid #30333e;border-radius:10px;padding:10px;margin:5px 0}.btn{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer}.ok{background:var(--green);color:#06130b}.bad{background:var(--red)}.gold{background:var(--gold);color:#1b1406}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.pill{display:inline-block;padding:4px 8px;border-radius:8px;background:#252832;font-size:11px}.pill.approved,.pill.paid{background:#123b28;color:#68eca7}.pill.pending{background:#493817;color:#ffd27c}.pill.blocked,.pill.rejected{background:#4a2026;color:#ff8990}.media{width:95px;height:120px;object-fit:cover;border-radius:12px;background:#222}.list{display:grid;gap:10px}.sectionTitle{display:flex;align-items:center;gap:10px}.sectionTitle h2{margin:4px 0}.small{font-size:12px}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.media{width:80px;height:100px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">Rivo Admin</div><div class="muted">শুধু Admin account-এর জন্য</div></div><button class="btn bad" onclick="logout()">Logout</button></div>
<div id="login"><div class="card"><h2>Admin Login</h2><input id="email" class="input" type="email" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p class="muted">Admin access profiles.is_admin দিয়ে সুরক্ষিত।</p></div></div>
<div id="panel" class="hidden">
<div class="grid"><div class="card metric"><div class="muted">Users</div><b id="uCount">0</b></div><div class="card metric"><div class="muted">Videos</div><b id="vCount">0</b></div><div class="card metric"><div class="muted">Pending Videos</div><b id="pCount">0</b></div><div class="card metric"><div class="muted">Withdrawals</div><b id="wCount">0</b></div></div>
<div class="card"><div class="sectionTitle"><h2 class="grow">Earning Settings</h2></div><div class="row"><input id="globalRate" class="input" type="number" step="0.01" placeholder="৳ per 1000 views"><input id="minPayout" class="input" type="number" step="1" placeholder="Minimum payout"><button class="btn" onclick="saveSettings()">Save</button></div><div class="muted">User dashboard-এ এই rate দেখাবে।</div></div>
<div class="card"><div class="sectionTitle"><h2 class="grow">Notice Board</h2></div><input id="nt" class="input" placeholder="Notice title"><textarea id="nb" class="input" rows="3" placeholder="Notice message / offer / announcement"></textarea><button class="btn" onclick="addNotice()">Publish Notice</button><div id="notices" class="list"></div></div>
<div class="card"><div class="sectionTitle"><h2 class="grow">User Instructions</h2></div><input id="gt" class="input" placeholder="Guide title"><textarea id="gb" class="input" rows="4" placeholder="Guide / rules text"></textarea><input id="gs" class="input" type="number" value="99" placeholder="Sort order"><button class="btn" onclick="addGuide()">Add Guide</button><div id="guides" class="list"></div></div>
<div class="card"><div class="sectionTitle"><h2 class="grow">Users</h2><button class="btn" onclick="loadAll()">Refresh</button></div><div id="users" class="list"></div></div>
<div class="card"><div class="sectionTitle"><h2 class="grow">Videos / Moderation / Earnings</h2></div><div id="videos" class="list"></div></div>
<div class="card"><div class="sectionTitle"><h2 class="grow">Withdrawal Requests</h2></div><div id="withdrawals" class="list"></div></div>
</div></div>
<script>
const sb=supabase.createClient('https://ayoactrisfcdhmhsnrwz.supabase.co','sb_publishable_pvPMH5zhPX3_vjarFMrYtw_9uZkagYX');let me=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'৳'+Number(n||0).toFixed(2);
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(error)return alert(error.message);me=data.user;await boot()}
async function boot(){if(!me)return;const {data:p,error}=await sb.from('profiles').select('id,username,full_name,is_admin').eq('id',me.id).maybeSingle();if(error||!p?.is_admin){await sb.auth.signOut();return alert('এই account Admin নয়। আপনার Rasel account-এ is_admin=true থাকতে হবে।')}document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');await loadAll()}
async function loadAll(){const [u,v,w,n,g,s]=await Promise.all([sb.from('profiles').select('id,username,full_name,avatar_url,is_admin,created_at').order('created_at',{ascending:false}),sb.from('videos').select('id,user_id,video_url,media_type,caption,views,status,moderation_status,earning_rate,earning_amount,created_at,profiles(username,full_name)').order('created_at',{ascending:false}),sb.from('payout_requests').select('id,user_id,amount,payment_method,payment_account,status,created_at,paid_at').order('created_at',{ascending:false}),sb.from('notices').select('*').order('created_at',{ascending:false}),sb.from('guides').select('*').order('sort_order'),sb.from('app_settings').select('key,value')]);
if(u.error)alert(u.error.message);if(v.error)alert(v.error.message);if(w.error)alert(w.error.message);
const users=u.data||[],videos=v.data||[],withdrawals=w.data||[];document.getElementById('uCount').textContent=users.length;document.getElementById('vCount').textContent=videos.length;document.getElementById('pCount').textContent=videos.filter(x=>x.moderation_status==='pending').length;document.getElementById('wCount').textContent=withdrawals.filter(x=>x.status==='pending').length;
const settings=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));globalRate.value=settings.earning_rate_per_1000_views||1;minPayout.value=settings.minimum_payout||100;
document.getElementById('users').innerHTML=users.map(x=>`<div class="card"><div class="row"><img class="media" style="width:52px;height:52px;border-radius:50%" src="${esc(x.avatar_url||'https://ui-avatars.com/api/?name=R&background=30333d&color=fff')}"><div class="grow"><b>@${esc(x.username||'user')}</b><div class="muted">${esc(x.full_name||'')} · ID: ${esc(x.id)}</div></div><span class="pill">${x.is_admin?'ADMIN':'USER'}</span></div></div>`).join('')||'<div class="muted">No users</div>';
document.getElementById('videos').innerHTML=videos.map(x=>{const pending=x.moderation_status==='pending';return `<div class="card"><div class="row"><div class="grow"><b>@${esc(x.profiles?.username||'user')}</b> · ${esc(x.media_type)} · ${Number(x.views||0).toLocaleString()} views</div><span class="pill ${esc(x.moderation_status||'pending')}">${esc(x.moderation_status||'pending')}</span></div><div class="row" style="margin-top:10px"><${x.media_type==='image'?'img':'video'} class="media" ${x.media_type==='image'?`src="${esc(x.video_url)}"`:`src="${esc(x.video_url)}" controls muted playsinline`} ></${x.media_type==='image'?'img':'video'}><div class="grow"><div>${esc(x.caption||'')}</div><div class="muted">Current rate: ${money(x.earning_rate||settings.earning_rate_per_1000_views)} / 1000 · earning: ${money(x.earning_amount)}</div><input id="rate-${x.id}" class="input" type="number" step="0.01" value="${Number(x.earning_rate||settings.earning_rate_per_1000||1)}"><div class="row"><button class="btn" onclick="saveVideoRate('${x.id}',${Number(x.views||0)})">Save Rate</button>${pending?`<button class="btn ok" onclick="approveVideo('${x.id}')">Approve</button><button class="btn bad" onclick="blockVideo('${x.id}')">Reject/Block</button>`:''}${x.moderation_status==='approved'?`<button class="btn bad" onclick="blockVideo('${x.id}')">Block</button>`:''}</div></div></div></div>`}).join('')||'<div class="muted">No videos</div>';
document.getElementById('withdrawals').innerHTML=withdrawals.map(x=>`<div class="card"><div class="row"><b class="grow">${money(x.amount)} · ${esc(x.payment_method)}</b><span class="pill ${esc(x.status)}">${esc(x.status)}</span></div><div>${esc(x.payment_account)} · user: ${esc(x.user_id)}</div><div class="muted">${new Date(x.created_at).toLocaleString('bn-BD')}</div>${x.status==='pending'?`<div class="row" style="margin-top:8px"><button class="btn ok" onclick="markPaid('${x.id}')">Mark Paid</button><button class="btn bad" onclick="rejectPayout('${x.id}')">Reject</button></div>`:''}</div>`).join('')||'<div class="muted">No withdrawal request</div>';
document.getElementById('notices').innerHTML=(n.data||[]).map(x=>`<div class="card"><div class="row"><b class="grow">${esc(x.title)}</b><span class="pill">${x.is_active?'Active':'Off'}</span></div><div class="muted">${esc(x.body)}</div><button class="btn bad" onclick="deleteRow('notices',${x.id})">Delete</button></div>`).join('');
document.getElementById('guides').innerHTML=(g.data||[]).map(x=>`<div class="card"><div class="row"><b class="grow">${esc(x.title)}</b><span class="pill">${x.sort_order}</span></div><div class="muted">${esc(x.body)}</div><button class="btn bad" onclick="deleteRow('guides',${x.id})">Delete</button></div>`).join('');
}
async function saveSettings(){const r=Number(globalRate.value),m=Number(minPayout.value);if(r<0||m<1)return alert('Rate/Minimum সঠিক দিন');const ops=[sb.from('app_settings').upsert({key:'earning_rate_per_1000_views',value:String(r),updated_at:new Date().toISOString()}),sb.from('app_settings').upsert({key:'minimum_payout',value:String(m),updated_at:new Date().toISOString()})];const res=await Promise.all(ops);const bad=res.find(x=>x.error);if(bad)return alert(bad.error.message);alert('Earning settings saved');loadAll()}
async function addNotice(){if(!nt.value.trim()||!nb.value.trim())return alert('Title এবং message দিন');const {error}=await sb.from('notices').insert({title:nt.value.trim(),body:nb.value.trim(),is_active:true});if(error)return alert(error.message);nt.value='';nb.value='';loadAll()}
async function addGuide(){if(!gt.value.trim()||!gb.value.trim())return alert('Guide title/text দিন');const {error}=await sb.from('guides').insert({title:gt.value.trim(),body:gb.value.trim(),sort_order:Number(gs.value)||99,is_active:true});if(error)return alert(error.message);gt.value='';gb.value='';loadAll()}
async function saveVideoRate(id,views){const r=Number(document.getElementById('rate-'+id).value);if(r<0)return alert('Rate ভুল');const amount=(Number(views||0)/1000)*r;const {error}=await sb.from('videos').update({earning_rate:r,earning_amount:amount}).eq('id',id);if(error)return alert(error.message);loadAll()}
async function approveVideo(id){const rate=Number(document.getElementById('rate-'+id).value)||Number(globalRate.value)||1;const {data:v}=await sb.from('videos').select('views').eq('id',id).single();const amount=(Number(v?.views||0)/1000)*rate;const {error}=await sb.from('videos').update({status:'published',moderation_status:'approved',earning_rate:rate,earning_amount:amount}).eq('id',id);if(error)return alert(error.message);loadAll()}
async function blockVideo(id){const {error}=await sb.from('videos').update({status:'blocked',moderation_status:'blocked',admin_note:'Blocked by admin'}).eq('id',id);if(error)return alert(error.message);loadAll()}
async function markPaid(id){const {error}=await sb.from('payout_requests').update({status:'paid',paid_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);loadAll()}
async function rejectPayout(id){const {error}=await sb.from('payout_requests').update({status:'rejected',admin_note:'Rejected by admin'}).eq('id',id);if(error)return alert(error.message);loadAll()}
async function deleteRow(table,id){if(!confirm('Delete করবেন?'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)return alert(error.message);loadAll()}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.getUser().then(r=>{if(r.data.user){me=r.data.user;boot()}})
</script>
</body>
</html>
