<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Rivo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#09070e;
 color:white;
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,textarea{font:inherit}

button{cursor:pointer}

.app{
 width:100%;
 max-width:520px;
 height:100dvh;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:#0d0a12
}

/* AUTH */

#auth{
 position:absolute;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at 20% 20%,#ff2d7560,transparent 35%),
 radial-gradient(circle at 80% 80%,#7c3cff55,transparent 40%),
 #09070d
}

.authbox{
 width:100%;
 padding:28px 20px;
 border-radius:25px;
 background:#17131ddd;
 border:1px solid #ffffff18
}

.logo{
 font-size:48px;
 font-weight:950;
 text-align:center;
 background:linear-gradient(90deg,#fff,#ff3f87,#9d5cff);
 -webkit-background-clip:text;
 color:transparent
}

.subtitle{
 text-align:center;
 color:#aaa;
 margin-bottom:20px
}

input,textarea{
 width:100%;
 padding:14px;
 margin:6px 0;
 border:1px solid #ffffff15;
 border-radius:13px;
 background:#0b0910;
 color:white;
 outline:none
}

.btn{
 width:100%;
 padding:14px;
 margin-top:8px;
 border:0;
 border-radius:13px;
 background:linear-gradient(90deg,#ff2d75,#8b5cff);
 color:white;
 font-weight:800
}

.secondary{
 background:#27212f
}

.msg{
 text-align:center;
 color:#ff709f;
 margin-top:10px;
 min-height:22px
}

/* APP */

#app{
 display:none;
 height:100%
}

.feed{
 height:100%;
 overflow-y:auto;
 scroll-snap-type:y mandatory
}

.post{
 min-height:100dvh;
 position:relative;
 scroll-snap-align:start;
 background:#111
}

.media{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover
}

.overlay{
 position:absolute;
 inset:0;
 background:
 linear-gradient(#0008,transparent 30%),
 linear-gradient(transparent 45%,#000e)
}

.info{
 position:absolute;
 left:15px;
 right:85px;
 bottom:90px;
 z-index:5
}

.user{
 font-weight:900;
 font-size:18px
}

.caption{
 margin-top:8px;
 line-height:1.4
}

.actions{
 position:absolute;
 right:10px;
 bottom:100px;
 z-index:10;
 display:flex;
 flex-direction:column;
 gap:15px
}

.action{
 text-align:center
}

.action button{
 width:50px;
 height:50px;
 border:0;
 border-radius:50%;
 background:#ffffff25;
 color:white;
 font-size:22px
}

.action small{
 display:block;
 margin-top:3px
}

.liked{
 color:#ff3f87!important
}

.top{
 position:fixed;
 top:0;
 left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);
 z-index:30;
 padding:15px;
 display:flex;
 justify-content:space-between;
 background:linear-gradient(#09070dcc,transparent)
}

.top b{
 font-size:25px
}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);
 height:65px;
 z-index:40;
 display:flex;
 align-items:center;
 justify-content:space-around;
 background:#09070eee;
 border-top:1px solid #ffffff10
}

.bottom button{
 background:none;
 border:0;
 color:white;
 font-size:12px
}

.bottom b{
 display:block;
 font-size:22px
}

.plus{
 width:48px;
 height:38px;
 border-radius:10px!important;
 background:linear-gradient(90deg,#ff2d75,#8b5cff)!important;
 font-size:25px!important
}

/* PANELS */

.panel{
 display:none;
 position:absolute;
 inset:0;
 z-index:70;
 overflow-y:auto;
 padding:65px 16px 90px;
 background:#100c16
}

.close{
 position:absolute;
 right:15px;
 top:13px;
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:#29222f;
 color:white;
 font-size:22px
}

.card{
 padding:16px;
 margin:10px 0;
 border-radius:18px;
 background:#1b1622;
 border:1px solid #ffffff0d
}

.preview{
 display:none;
 width:100%;
 max-height:350px;
 margin-top:10px;
 border-radius:15px;
 overflow:hidden;
 background:#050509
}

.preview img,
.preview video{
 width:100%;
 max-height:350px;
 object-fit:contain
}

.progress{
 height:6px;
 background:#332c38;
 border-radius:10px;
 margin-top:10px;
 overflow:hidden
}

.bar{
 width:0%;
 height:100%;
 background:#ff2d75
}

.avatar{
 width:90px;
 height:90px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #ff3f87
}

.profile{
 text-align:center
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:3px
}

.grid div{
 aspect-ratio:1;
 background:#211b29;
 overflow:hidden
}

.grid img,.grid video{
 width:100%;
 height:100%;
 object-fit:cover
}

.comment{
 padding:10px 0;
 border-bottom:1px solid #ffffff12
}

.toast{
 display:none;
 position:fixed;
 z-index:200;
 left:50%;
 bottom:80px;
 transform:translateX(-50%);
 background:white;
 color:#111;
 padding:11px 16px;
 border-radius:13px;
 font-weight:800;
 max-width:90%
}
</style>
</head>

<body>

<div class="app">

<!-- LOGIN -->

<div id="auth">

<div class="authbox">

<div class="logo">Rivo</div>

<div class="subtitle">
Short videos. Real people.
</div>

<input id="email"
type="email"
placeholder="Email">

<input id="password"
type="password"
placeholder="Password">

<button class="btn"
onclick="signup()">
Create account
</button>

<button class="btn secondary"
onclick="login()">
Login
</button>

<div id="authMsg" class="msg"></div>

</div>
</div>


<!-- MAIN -->

<div id="app">

<div class="top">
<b>Rivo</b>
<button onclick="openPanel('searchPanel')">🔎</button>
</div>

<div id="feed" class="feed"></div>


<div class="bottom">

<button onclick="loadFeed()">
<b>⌂</b>
Home
</button>

<button onclick="openPanel('searchPanel')">
<b>🔎</b>
Search
</button>

<button class="plus"
onclick="openPanel('uploadPanel')">
+
</button>

<button onclick="openProfile()">
<b>👤</b>
Profile
</button>

<button onclick="logout()">
<b>↪</b>
Logout
</button>

</div>


<!-- UPLOAD -->

<div id="uploadPanel" class="panel">

<button class="close"
onclick="closePanels()">×</button>

<h2>নতুন Post</h2>

<div class="card">

<input id="mediaFile"
type="file"
accept="image/*,video/*"
onchange="previewFile()">

<div id="preview" class="preview"></div>

<textarea id="caption"
placeholder="কিছু লিখুন..."></textarea>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<button class="btn"
onclick="uploadPost()">
Post করুন
</button>

<p id="uploadMsg"></p>

</div>
</div>


<!-- SEARCH -->

<div id="searchPanel" class="panel">

<button class="close"
onclick="closePanels()">×</button>

<h2>Search</h2>

<div class="card">

<input id="search"
placeholder="Username লিখুন"
oninput="searchUsers()">

<div id="results"></div>

</div>

</div>


<!-- PROFILE -->

<div id="profilePanel" class="panel">

<button class="close"
onclick="closePanels()">×</button>

<div id="profileContent"></div>

</div>


<!-- COMMENTS -->

<div id="commentPanel" class="panel">

<button class="close"
onclick="closePanels()">×</button>

<h2>Comments</h2>

<div id="comments"></div>

<div class="card">

<input id="commentInput"
placeholder="Comment লিখুন">

<button class="btn"
onclick="sendComment()">
Send
</button>

</div>

</div>

</div>

</div>

<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL =
"https://ayoactrisfcdhmhsnrwz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pvPMH5zhPX3_vjarFMrYtw_9uZkagYX";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser=null;
let currentCommentPost=null;


/* =====================
AUTH
===================== */

async function signup(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 if(!email || !password){
  msg("Email এবং Password দিন");
  return;
 }

 const {data,error}=
 await client.auth.signUp({
  email,
  password
 });

 if(error){
  msg(error.message);
  return;
 }

 if(data.user){

  await client.from("profiles").upsert({
   id:data.user.id,
   username:email.split("@")[0],
   display_name:email.split("@")[0],
   bio:"",
   avatar_url:""
  });

 }

 msg("Account তৈরি হয়েছে। Email verify লাগতে পারে।");
}


async function login(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 const {data,error}=
 await client.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  msg(error.message);
  return;
 }

 currentUser=data.user;

 showApp();
}


async function logout(){

 await client.auth.signOut();

 currentUser=null;

 document.getElementById("app").style.display="none";
 document.getElementById("auth").style.display="flex";
}


function msg(text){

 document.getElementById("authMsg").textContent=text;

}


/* =====================
START
===================== */

async function start(){

 const {data}=
 await client.auth.getSession();

 if(data.session){

  currentUser=data.session.user;

  showApp();

 }

}


function showApp(){

 document.getElementById("auth").style.display="none";

 document.getElementById("app").style.display="block";

 loadFeed();

}


/* =====================
FEED
===================== */

async function loadFeed(){

 const feed=
 document.getElementById("feed");

 feed.innerHTML=
 "<div style='padding:100px;text-align:center'>Loading...</div>";

 const {data:posts,error}=
 await client
 .from("posts")
 .select("*")
 .order("created_at",{ascending:false});

 if(error){

  feed.innerHTML=
  "<div style='padding:100px;text-align:center'>Post load হয়নি</div>";

  return;
 }

 if(!posts || posts.length===0){

  feed.innerHTML=
  "<div style='padding:100px;text-align:center'>এখনো কোনো Post নেই।<br><br>প্রথম Post আপনিই দিন ❤️</div>";

  return;
 }

 const userIds=
 [...new Set(posts.map(p=>p.user_id))];

 const {data:profiles}=
 await client
 .from("profiles")
 .select("*")
 .in("id",userIds);

 const profileMap={};

 (profiles||[]).forEach(p=>{
  profileMap[p.id]=p;
 });

 feed.innerHTML="";

 for(const post of posts){

  const p=
  profileMap[post.user_id]||{};

  const {count:likeCount}=
  await client
  .from("likes")
  .select("*",{count:"exact",head:true})
  .eq("post_id",post.id);

  let liked=false;

  if(currentUser){

   const {data:myLike}=
   await client
   .from("likes")
   .select("post_id")
   .eq("post_id",post.id)
   .eq("user_id",currentUser.id)
   .maybeSingle();

   liked=!!myLike;

  }

  const postEl=
  document.createElement("div");

  postEl.className="post";

  const media=
  post.media_type==="video"
  ?
  `<video class="media" src="${post.media_url}" controls playsinline></video>`
  :
  `<img class="media" src="${post.media_url}">`;

  postEl.innerHTML=`

  ${media}

  <div class="overlay"></div>

  <div class="info">

   <div class="user">
   @${escapeHtml(p.username||"user")}
   </div>

   <div class="caption">
   ${escapeHtml(post.caption||"")}
   </div>

  </div>

  <div class="actions">

   <div class="action">

    <button
    class="${liked?'liked':''}"
    onclick="toggleLike('${post.id}',this)">
    ❤️
    </button>

    <small>${likeCount||0}</small>

   </div>

   <div class="action">

    <button
    onclick="openComments('${post.id}')">
    💬
    </button>

   </div>

   <div class="action">

    <button
    onclick="sharePost('${post.media_url}')">
    ↗️
    </button>

   </div>

  </div>
  `;

  feed.appendChild(postEl);

 }

}


/* =====================
LIKE
===================== */

async function toggleLike(postId,button){

 if(!currentUser){
  toast("Login করুন");
  return;
 }

 const {data:existing}=
 await client
 .from("likes")
 .select("*")
 .eq("post_id",postId)
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(existing){

  await client
  .from("likes")
  .delete()
  .eq("post_id",postId)
  .eq("user_id",currentUser.id);

  button.classList.remove("liked");

 }else{

  await client
  .from("likes")
  .insert({
   post_id:postId,
   user_id:currentUser.id
  });

  button.classList.add("liked");

 }

 loadFeed();

}


/* =====================
UPLOAD PREVIEW
===================== */

function previewFile(){

 const file=
 document.getElementById("mediaFile").files[0];

 const box=
 document.getElementById("preview");

 if(!file){
  box.style.display="none";
  return;
 }

 const url=
 URL.createObjectURL(file);

 if(file.type.startsWith("video")){

  box.innerHTML=
  `<video src="${url}" controls></video>`;

 }else{

  box.innerHTML=
  `<img src="${url}">`;

 }

 box.style.display="block";
}


/* =====================
UPLOAD
===================== */

async function uploadPost(){

 if(!currentUser){
  toast("Login করুন");
  return;
 }

 const file=
 document.getElementById("mediaFile").files[0];

 const caption=
 document.getElementById("caption").value.trim();

 if(!file){

  toast("ছবি অথবা ভিডিও নির্বাচন করুন");
  return;
 }

 const extension=
 file.name.split(".").pop();

 const path=
 `${currentUser.id}/${Date.now()}.${extension}`;

 document.getElementById("uploadMsg").textContent=
 "Upload হচ্ছে...";

 const {error:uploadError}=
 await client
 .storage
 .from("media")
 .upload(path,file,{
  contentType:file.type,
  upsert:false
 });

 if(uploadError){

  document.getElementById("uploadMsg").textContent=
  uploadError.message;

  return;
 }

 const {data:urlData}=
 client
 .storage
 .from("media")
 .getPublicUrl(path);

 const mediaType=
 file.type.startsWith("video")
 ?"video"
 :"image";

 const {error}=
 await client
 .from("posts")
 .insert({
  user_id:currentUser.id,
  media_url:urlData.publicUrl,
  media_type:mediaType,
  caption:caption
 });

 if(error){

  document.getElementById("uploadMsg").textContent=
  error.message;

  return;
 }

 toast("Post হয়েছে ❤️");

 document.getElementById("mediaFile").value="";
 document.getElementById("caption").value="";
 document.getElementById("preview").style.display="none";

 closePanels();

 loadFeed();

}


/* =====================
COMMENTS
===================== */

async function openComments(postId){

 currentCommentPost=postId;

 openPanel("commentPanel");

 const box=
 document.getElementById("comments");

 box.innerHTML="Loading...";

 const {data:comments}=
 await client
 .from("comments")
 .select("*")
 .eq("post_id",postId)
 .order("created_at",{ascending:true});

 if(!comments||comments.length===0){

  box.innerHTML=
  "<p style='color:#aaa'>কোনো Comment নেই।</p>";

  return;
 }

 const ids=
 [...new Set(comments.map(c=>c.user_id))];

 const {data:profiles}=
 await client
 .from("profiles")
 .select("id,username")
 .in("id",ids);

 const map={};

 (profiles||[]).forEach(p=>{
  map[p.id]=p.username;
 });

 box.innerHTML="";

 comments.forEach(c=>{

  const div=
  document.createElement("div");

  div.className="comment";

  div.innerHTML=`
  <b>@${escapeHtml(map[c.user_id]||"user")}</b>
  ${escapeHtml(c.body)}
  `;

  box.appendChild(div);

 });

}


async function sendComment(){

 if(!currentUser){

  toast("Login করুন");
  return;

 }

 const input=
 document.getElementById("commentInput");

 const body=input.value.trim();

 if(!body)return;

 const {error}=
 await client
 .from("comments")
 .insert({
  post_id:currentCommentPost,
  user_id:currentUser.id,
  body
 });

 if(error){

  toast(error.message);
  return;

 }

 input.value="";

 openComments(currentCommentPost);

}


/* =====================
SHARE
===================== */

async function sharePost(url){

 try{

  if(navigator.share){

   await navigator.share({
    title:"Rivo",
    text:"Rivo-তে এই Post দেখুন",
    url:url
   });

  }else{

   await navigator.clipboard.writeText(url);

   toast("Link copy হয়েছে");

  }

 }catch(e){}

}


/* =====================
PROFILE
===================== */

async function openProfile(userId=null){

 const id=
 userId||currentUser.id;

 openPanel("profilePanel");

 const {data:p}=
 await client
 .from("profiles")
 .select("*")
 .eq("id",id)
 .single();

 const {data:posts}=
 await client
 .from("posts")
 .select("*")
 .eq("user_id",id)
 .order("created_at",{ascending:false});

 const avatar=
 p?.avatar_url
 ||
 "https://ui-avatars.com/api/?name="+
 encodeURIComponent(p?.username||"R");

 const box=
 document.getElementById("profileContent");

 box.innerHTML=`

 <div class="profile">

 <img
 class="avatar"
 src="${avatar}">

 <h2>
 @${escapeHtml(p?.username||"user")}
 </h2>

 <p>
 ${escapeHtml(p?.bio||"")}
 </p>

 <p>
 ${posts?.length||0} Posts
 </p>

 ${id===currentUser.id
 ?
 `<button class="btn"
 onclick="editProfile()">
 Edit Profile
 </button>`
 :""}

 </div>

 <h3>Posts</h3>

 <div class="grid" id="profileGrid"></div>
 `;

 const grid=
 document.getElementById("profileGrid");

 (posts||[]).forEach(post=>{

  const item=
  document.createElement("div");

  if(post.media_type==="video"){

   item.innerHTML=
   `<video src="${post.media_url}" controls></video>`;

  }else{

   item.innerHTML=
   `<img src="${post.media_url}">`;

  }

  grid.appendChild(item);

 });

}


/* =====================
EDIT PROFILE
===================== */

async function editProfile(){

 const username=
 prompt(
 "Username:",
 document.querySelector("#profileContent h2")
 ?.textContent
 ?.replace("@","")||""
 );

 if(username===null)return;

 const bio=
 prompt(
 "Bio:"
 );

 const {error}=
 await client
 .from("profiles")
 .update({
  username:username.trim(),
  bio:bio||""
 })
 .eq("id",currentUser.id);

 if(error){

  toast(error.message);
  return;

 }

 openProfile();

}


/* =====================
SEARCH
===================== */

async function searchUsers(){

 const term=
 document.getElementById("search")
 .value
 .trim()
 .toLowerCase();

 const results=
 document.getElementById("results");

 if(!term){

  results.innerHTML="";
  return;

 }

 const {data}=
 await client
 .from("profiles")
 .select("*")
 .ilike("username",`%${term}%`)
 .limit(20);

 results.innerHTML="";

 (data||[]).forEach(p=>{

  const div=
  document.createElement("div");

  div.className="card";

  div.innerHTML=`

  <b>
  @${escapeHtml(p.username||"user")}
  </b>

  <p>
  ${escapeHtml(p.bio||"")}
  </p>

  <button class="btn"
  onclick="openProfile('${p.id}')">
  Profile দেখুন
  </button>

  `;

  results.appendChild(div);

 });

}


/* =====================
PANELS
===================== */

function openPanel(id){

 document
 .querySelectorAll(".panel")
 .forEach(x=>x.style.display="none");

 document.getElementById(id).style.display="block";

}

function closePanels(){

 document
 .querySelectorAll(".panel")
 .forEach(x=>x.style.display="none");

}


/* =====================
HELPERS
===================== */

function toast(text){

 const t=
 document.getElementById("toast");

 t.textContent=text;

 t.style.display="block";

 setTimeout(()=>{
  t.style.display="none";
 },2500);

}

function escapeHtml(value){

 return String(value||"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


/* START */

start();

</script>

</body>
</html>
