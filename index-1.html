<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RIVO — Short Video Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07070a;--panel:#101116;--panel2:#171820;--text:#fff;--muted:#9b9da8;--pink:#ff2d75;--purple:#8b5cf6;--line:#252630;--green:#35d07f}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}
body{min-height:100vh}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);position:relative;overflow:hidden}
.top{height:66px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,10,.92);backdrop-filter:blur(18px);position:fixed;z-index:30;top:0;left:50%;transform:translateX(-50%);width:min(520px,100%);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-size:27px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,#ff2d75,#a855f7,#45b7ff);-webkit-background-clip:text;background-clip:text;color:transparent}.tabs{display:flex;gap:16px;align-items:center}.tab{background:none;color:#8d8f9a;font-weight:800}.tab.active{color:#fff}.iconbtn{width:40px;height:40px;border-radius:14px;background:#171820;display:grid;place-items:center;font-size:20px}
main{padding-top:66px;padding-bottom:78px;min-height:100vh}.screen{display:none}.screen.active{display:block}
.feed{height:calc(100vh - 66px);min-height:560px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}
.card{height:calc(100vh - 66px);min-height:560px;position:relative;scroll-snap-align:start;background:#111;overflow:hidden}.card video,.card .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050505}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 42%,rgba(0,0,0,.85) 100%)}
.card-info{position:absolute;left:18px;right:88px;bottom:24px}.userline{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#222;border:2px solid #fff}.handle{font-weight:900}.follow{background:var(--pink);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:900}.caption{margin:10px 0 7px;line-height:1.4}.tags{color:#ddd;font-size:13px}.music{font-size:12px;color:#ddd;margin-top:9px}
.actions{position:absolute;right:12px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px}.action{background:rgba(18,18,23,.72);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;backdrop-filter:blur(8px)}.action.liked{color:#ff477f}.actionlabel{font-size:11px;color:#ddd;margin-bottom:6px}
.nav{position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:78px;background:rgba(10,10,14,.95);backdrop-filter:blur(20px);border-top:1px solid #24242c;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.navbtn{background:none;color:#8e909a;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}.navbtn.active{color:#fff}.navbtn b{font-size:23px;line-height:1}.plus{width:48px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ff2d75,#8b5cf6);font-size:26px!important;color:#fff!important;box-shadow:0 8px 25px #ff2d7540}
.panel{padding:18px}.section-title{font-size:22px;font-weight:900;margin:8px 0 16px}.search{height:48px;border:1px solid var(--line);background:#121319;border-radius:15px;padding:0 16px;color:#fff;width:100%;outline:none}.search:focus{border-color:#ff2d75}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tile{aspect-ratio:3/4;background:#15161b;position:relative;overflow:hidden}.tile video,.tile img{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;left:6px;bottom:5px;font-size:11px;text-shadow:0 1px 5px #000}
.profile-head{text-align:center;padding:24px 18px 16px}.profile-big{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#222;border:3px solid #ff2d75}.stats{display:flex;justify-content:center;gap:34px;margin:18px 0}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.edit{background:#202128;border:1px solid #343540;padding:10px 20px;border-radius:11px;font-weight:800}
.modal{position:fixed;inset:0;background:#0009;z-index:80;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#111218;border-radius:24px 24px 0 0;padding:18px;border-top:1px solid #2b2c35}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{background:#24252c;width:38px;height:38px;border-radius:50%}.field{width:100%;background:#171820;border:1px solid #292b35;color:#fff;border-radius:14px;padding:13px;outline:none;margin:7px 0}.field:focus{border-color:#ff2d75}.primary{width:100%;padding:14px;border-radius:14px;background:linear-gradient(90deg,#ff2d75,#8b5cf6);font-weight:900;margin-top:8px}.secondary{width:100%;padding:13px;border-radius:14px;background:#22232b;font-weight:800;margin-top:8px}.preview{width:100%;aspect-ratio:9/14;background:#050505;border-radius:18px;overflow:hidden;margin:8px 0}.preview video{width:100%;height:100%;object-fit:cover}.row{display:flex;gap:8px}.row>*{flex:1}.range{width:100%}.muted{color:var(--muted);font-size:13px}.empty{text-align:center;color:var(--muted);padding:70px 25px}.toast{position:fixed;z-index:120;left:50%;bottom:94px;transform:translateX(-50%) translateY(20px);background:#f6f6f7;color:#111;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:90%}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.auth-logo{text-align:center;font-size:42px;font-weight:950;margin:12px 0;background:linear-gradient(90deg,#ff2d75,#8b5cf6);-webkit-background-clip:text;color:transparent}.auth-switch{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}.link{color:#ff4b88;font-weight:800;cursor:pointer}
.comment{padding:12px 0;border-bottom:1px solid #24252c}.comment b{font-size:13px}.comment p{margin:4px 0;color:#ddd}
@media(min-width:700px){body{background:#030305}.app{box-shadow:0 0 60px #000}.feed,.card{height:calc(100vh - 66px)}}

.settings-list{display:flex;flex-direction:column;gap:8px}.setting{display:flex;align-items:center;gap:14px;width:100%;padding:17px 15px;border-radius:15px;background:#15161c;border:1px solid #242630;text-align:left;font-weight:800}.setting span{flex:1}.setting b{color:#777;font-size:22px}.demo-bg{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#8b5cf6 0,#21133d 30%,#08080c 72%);overflow:hidden}.demo-bg:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-90px;bottom:90px;background:linear-gradient(135deg,#ff2d75,#8b5cf6);filter:blur(55px);opacity:.55}.demo-copy{position:absolute;z-index:2;left:25px;right:25px;top:24%;text-align:left}.demo-badge{display:inline-block;padding:7px 12px;border-radius:12px;background:#ffffff18;border:1px solid #ffffff28;font-weight:900;letter-spacing:2px}.demo-copy h1{font-size:38px;line-height:1.05;margin:18px 0 10px;letter-spacing:-1.5px}.demo-copy p{color:#ddd;line-height:1.5}.demo-avatar{display:grid;place-items:center;background:linear-gradient(135deg,#ff2d75,#8b5cf6);font-weight:950;font-size:20px}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">RIVO</div>
  <div class="tabs"><button class="tab active" data-feedtab="for-you">For You</button><button class="tab" data-feedtab="following">Following</button></div>
  <button class="iconbtn" id="searchBtn">⌕</button>
</header>

<main>
<section class="screen active" id="homeScreen"><div class="feed" id="feed"><div class="empty">RIVO লোড হচ্ছে…</div></div></section>

<section class="screen" id="discoverScreen"><div class="panel">
  <div class="section-title">Discover</div>
  <input class="search" id="discoverInput" placeholder="Search users, captions, hashtags…">
  <div id="discoverResults" style="margin-top:16px"></div>
</div></section>

<section class="screen" id="inboxScreen"><div class="panel">
  <div class="section-title">Inbox</div><div class="empty">আপনার notification ও messages এখানে দেখা যাবে।</div>
</div></section>

<section class="screen" id="profileScreen"><div id="profileContent"></div></section>
<section class="screen" id="settingsScreen"><div class="panel"><div class="section-title">Settings</div>
<div class="settings-list">
<button class="setting" onclick="showAccount()">👤 <span>Account</span><b>›</b></button>
<button class="setting" onclick="showPrivacy()">🔒 <span>Privacy & Safety</span><b>›</b></button>
<button class="setting" onclick="showNotifications()">🔔 <span>Notifications</span><b>›</b></button>
<button class="setting" onclick="toggleTheme()">🌙 <span>Appearance</span><b>›</b></button>
<button class="setting" onclick="toast('RIVO v1.0')">ℹ️ <span>About RIVO</span><b>›</b></button>
</div><button class="secondary" onclick="currentUser?db?.auth.signOut().then(()=>location.reload()):modal('authModal')">${currentUser?'Log out':'Log in'}</button>
</div></section>
</main>

<nav class="nav">
  <button class="navbtn active" data-screen="homeScreen">⌂<span>Home</span></button>
  <button class="navbtn" data-screen="discoverScreen">⌕<span>Discover</span></button>
  <button class="navbtn" id="uploadBtn"><b class="plus">+</b><span>Upload</span></button>
  <button class="navbtn" data-screen="inboxScreen">♡<span>Inbox</span></button>
  <button class="navbtn" data-screen="profileScreen">♙<span>Profile</span></button>
</nav>
</div>

<div class="modal" id="authModal"><div class="sheet">
 <div class="sheethead"><b id="authTitle">Welcome to RIVO</b><button class="close" data-close="authModal">×</button></div>
 <div class="auth-logo">RIVO</div><input class="field" id="authName" placeholder="Username" style="display:none">
 <input class="field" id="authEmail" type="email" placeholder="Email">
 <input class="field" id="authPassword" type="password" placeholder="Password">
 <button class="primary" id="authSubmit">Continue</button>
 <div class="auth-switch"><span id="authHint">Don't have an account?</span> <span class="link" id="authToggle">Sign up</span></div>
</div></div>

<div class="modal" id="uploadModal"><div class="sheet">
 <div class="sheethead"><b>Create a video</b><button class="close" data-close="uploadModal">×</button></div>
 <input class="field" id="videoFile" type="file" accept="video/*">
 <div class="preview"><video id="editVideo" controls playsinline></video></div>
 <div class="row"><label class="muted">Speed<input class="range" id="speed" type="range" min=".5" max="2" step=".1" value="1"></label><label class="muted">Volume<input class="range" id="volume" type="range" min="0" max="1" step=".05" value="1"></label></div>
 <input class="field" id="caption" placeholder="Write a caption…">
 <input class="field" id="hashtags" placeholder="#Rivo #BanglaVibes">
 <button class="primary" id="publishBtn">Post Video</button>
 <p class="muted">Basic edit preview: speed/volume. The original video is uploaded unchanged.</p>
</div></div>

<div class="modal" id="commentModal"><div class="sheet">
 <div class="sheethead"><b>Comments</b><button class="close" data-close="commentModal">×</button></div>
 <div id="comments"></div><input class="field" id="commentText" placeholder="Write a comment…"><button class="primary" id="sendComment">Send Comment</button>
</div></div>

<div class="modal" id="editProfileModal"><div class="sheet">
 <div class="sheethead"><b>Edit Profile</b><button class="close" data-close="editProfileModal">×</button></div>
 <input class="field" id="editUsername" placeholder="Username">
 <input class="field" id="editFullName" placeholder="Full name">
 <input class="field" id="editBio" placeholder="Bio">
 <input class="field" id="editAvatar" placeholder="Avatar image URL (optional)">
 <button class="primary" id="saveProfile">Save Profile</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://ayoactrisfcdhmhsnrwz.supabase.co";
const SUPABASE_KEY="sb_publishable_pvPMH5zhPX3_vjarFMrYtw_9uZkagYX";
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let currentUser=null,currentProfile=null,currentVideo=null,authSignup=false;

function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2500)}
function modal(id,on=true){$(id).classList.toggle("open",on)}
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".navbtn[data-screen]").forEach(x=>x.classList.toggle("active",x.dataset.screen===id));if(id==="profileScreen")renderProfile();if(id==="homeScreen")loadFeed()}
function format(n){return Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(n||0)}

async function ensureProfile(user){
 if(!user)return null;
 let {data}=await db.from("profiles").select("id,username,full_name,avatar_url,bio,created_at").eq("id",user.id).maybeSingle();
 if(!data){
   const base=(user.email||"user").split("@")[0].replace(/[^a-zA-Z0-9_]/g,"").slice(0,18)||"user";
   const username=base+"_"+Math.random().toString(36).slice(2,6);
   const r=await db.from("profiles").insert({id:user.id,username,full_name:"",avatar_url:"",bio:""}).select("id,username,full_name,avatar_url,bio,created_at").single();
   data=r.data||{id:user.id,username,full_name:"",avatar_url:"",bio:""};
 }
 currentProfile=data;return data;
}
async function init(){
  if(db){
    try{
      const {data}=await db.auth.getSession();
      currentUser=data.session?.user||null;
      if(currentUser) await ensureProfile(currentUser);
    }catch(e){ console.warn(e); }
  }
  await loadFeed();
  renderProfile();
  renderSettings();
}
async function loadFeed(){
  if(!db){
    renderDemoFeed();
    return;
  }
  try{
    const {data:videos,error}=await db.from("videos").select("id,user_id,video_url,thumbnail_url,caption,hashtags,views,status,created_at").eq("status","published").order("created_at",{ascending:false}).limit(50);
    if(error || !videos?.length){ renderDemoFeed(); return; }
    const ids=[...new Set(videos.map(v=>v.user_id).filter(Boolean))];
    let profiles=[];
    if(ids.length){const r=await db.from("profiles").select("id,username,avatar_url,bio").in("id",ids);profiles=r.data||[]}
    const pm=new Map(profiles.map(p=>[p.id,p]));
    const {data:likes}=currentUser?await db.from("likes").select("video_id").eq("user_id",currentUser.id).in("video_id",videos.map(v=>v.id)):{data:[]};
    const liked=new Set((likes||[]).map(x=>x.video_id));
    $("feed").innerHTML="";
    for(const v of videos){
      const p=pm.get(v.user_id)||{};
      const article=document.createElement("article");article.className="card";
      article.innerHTML=`<video src="${esc(v.video_url)}" ${v.thumbnail_url?`poster="${esc(v.thumbnail_url)}"`:""} playsinline loop preload="metadata"></video><div class="shade"></div><div class="card-info"><div class="userline"><img class="avatar" src="${esc(p.avatar_url||"")}"><div class="handle">@${esc(p.username||"user")}</div><button class="follow" data-follow="${v.user_id}">Follow</button></div><div class="caption">${esc(v.caption||"")}</div><div class="tags">${esc(v.hashtags||"")}</div><div class="music">♫ Original Sound · RIVO</div></div><div class="actions"><button class="action ${liked.has(v.id)?"liked":""}" data-like="${v.id}">${liked.has(v.id)?"♥":"♡"}</button><span class="actionlabel">Like</span><button class="action" data-comment="${v.id}">💬</button><span class="actionlabel">Comment</span><button class="action" data-share="${v.id}">↗</button><span class="actionlabel">Share</span></div>`;
      $("feed").appendChild(article);
      const vid=article.querySelector("video");vid.onclick=()=>vid.paused?vid.play():vid.pause();
    }
    document.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>toggleLike(b.dataset.like,b));
    document.querySelectorAll("[data-comment]").forEach(b=>b.onclick=()=>openComments(b.dataset.comment));
    document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareVideo(b.dataset.share));
    document.querySelectorAll("[data-follow]").forEach(b=>b.onclick=()=>toggleFollow(b.dataset.follow,b));
    setupAutoplay();
  }catch(e){ console.warn(e); renderDemoFeed(); }
}

function renderDemoFeed(){
  $("feed").innerHTML=`<article class="card demo-card"><div class="demo-bg"><div class="demo-glow"></div><div class="demo-copy"><div class="demo-badge">RIVO</div><h1>Short videos.<br>Made for everyone.</h1><p>Upload • Edit • Like • Comment • Follow • Share</p><button class="primary" style="max-width:230px" onclick="modal('uploadModal')">+ Create your first video</button></div></div><div class="shade"></div><div class="card-info"><div class="userline"><div class="avatar demo-avatar">R</div><div class="handle">@rivo_official</div><button class="follow" onclick="screen('discoverScreen')">Explore</button></div><div class="caption">Welcome to RIVO — your short video community.</div><div class="tags">#Rivo #BanglaVibes #Creators</div></div><div class="actions"><button class="action" onclick="toast('Login to like videos')">♡</button><span class="actionlabel">Like</span><button class="action" onclick="screen('inboxScreen')">💬</button><span class="actionlabel">Comment</span><button class="action" onclick="shareVideo('welcome')">↗</button><span class="actionlabel">Share</span></div></article>`;
}
function setupAutoplay(){const obs=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(e.isIntersecting){v?.play().catch(()=>{})}else{v?.pause()}}),{threshold:.65});document.querySelectorAll(".card").forEach(x=>obs.observe(x))}

async function toggleLike(videoId,b){
 if(!currentUser){modal("authModal");return}
 const {data}=await db.from("likes").select("video_id").eq("user_id",currentUser.id).eq("video_id",videoId).maybeSingle();
 if(data){const r=await db.from("likes").delete().eq("user_id",currentUser.id).eq("video_id",videoId);if(r.error)toast(r.error.message);else{b.classList.remove("liked");b.textContent="♡";toast("Like removed")}}
 else{const r=await db.from("likes").insert({user_id:currentUser.id,video_id:videoId});if(r.error)toast(r.error.message);else{b.classList.add("liked");b.textContent="♥";toast("Liked ❤️")}}
}
async function toggleFollow(target,b){
 if(!currentUser){modal("authModal");return} if(target===currentUser.id){toast("নিজেকে follow করা যাবে না");return}
 const {data}=await db.from("follows").select("following_id").eq("follower_id",currentUser.id).eq("following_id",target).maybeSingle();
 if(data){await db.from("follows").delete().eq("follower_id",currentUser.id).eq("following_id",target);b.textContent="Follow";toast("Unfollowed")}
 else{const r=await db.from("follows").insert({follower_id:currentUser.id,following_id:target});if(r.error)toast(r.error.message);else{b.textContent="Following";toast("Following")}}
}
async function shareVideo(id){
 const url=location.href.split("#")[0]+"#video="+id;
 if(navigator.share){try{await navigator.share({title:"RIVO video",url})}catch{}}
 else{await navigator.clipboard?.writeText(url);toast("Video link copied")}
 if(currentUser)await db.from("shares").insert({video_id:id,user_id:currentUser.id});
}
async function openComments(id){
 currentVideo=id;modal("commentModal");$("comments").innerHTML="Loading…";
 const {data,error}=await db.from("comments").select("id,body,user_id,created_at").eq("video_id",id).order("created_at",{ascending:false});
 if(error){$("comments").textContent=error.message;return}
 const ids=[...new Set((data||[]).map(x=>x.user_id).filter(Boolean))];let ps=[];if(ids.length){const r=await db.from("profiles").select("id,username,avatar_url").in("id",ids);ps=r.data||[]}
 const pm=new Map(ps.map(p=>[p.id,p]));
 $("comments").innerHTML=(data||[]).map(c=>`<div class="comment"><b>@${esc(pm.get(c.user_id)?.username||"user")}</b><p>${esc(c.body)}</p></div>`).join("")||'<div class="empty" style="padding:30px">No comments yet.</div>';
}
$("sendComment").onclick=async()=>{if(!currentUser){modal("authModal");return}const body=$("commentText").value.trim();if(!body||!currentVideo)return;const r=await db.from("comments").insert({video_id:currentVideo,user_id:currentUser.id,body});if(r.error)toast(r.error.message);else{$("commentText").value="";openComments(currentVideo);toast("Comment added")}}

$("videoFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);$("editVideo").src=u;$("editVideo").load();modal("uploadModal")}
$("speed").oninput=e=>$("editVideo").playbackRate=+e.target.value;$("volume").oninput=e=>$("editVideo").volume=+e.target.value;
$("publishBtn").onclick=async()=>{
 if(!currentUser){modal("uploadModal",false);modal("authModal");return}
 const f=$("videoFile").files[0];if(!f){toast("একটি ভিডিও নির্বাচন করুন");return}
 if(f.size>150*1024*1024){toast("ভিডিও 150MB-এর মধ্যে রাখুন");return}
 $("publishBtn").disabled=true;$("publishBtn").textContent="Uploading…";
 const path=`${currentUser.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
 const up=await db.storage.from("videos").upload(path,f,{contentType:f.type||"video/mp4",upsert:false});
 if(up.error){toast("Storage error: "+up.error.message);$("publishBtn").disabled=false;$("publishBtn").textContent="Post Video";return}
 const pub=db.storage.from("videos").getPublicUrl(path).data.publicUrl;
 const r=await db.from("videos").insert({user_id:currentUser.id,video_url:pub,caption:$("caption").value.trim(),hashtags:$("hashtags").value.trim(),status:"published"});
 if(r.error){toast("Database error: "+r.error.message)}else{toast("Video posted 🎉");modal("uploadModal",false);$("videoFile").value="";$("caption").value="";$("hashtags").value="";loadFeed()}
 $("publishBtn").disabled=false;$("publishBtn").textContent="Post Video";
}

async function renderProfile(){
 const el=$("profileContent");
 if(!currentUser){
  el.innerHTML=`<div class="profile-head"><div class="profile-big" style="margin:auto;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#ff2d75,#8b5cf6)">R</div><h2>Your RIVO Profile</h2><p class="muted">Login to create your profile, upload videos and follow creators.</p><button class="primary" style="max-width:240px" onclick="modal('authModal')">Login / Sign up</button><button class="secondary" style="max-width:240px" onclick="screen('settingsScreen')">Settings</button></div>`;
  return;
 }
 let p=currentProfile||{username:"user",full_name:"",bio:"",avatar_url:""};
 let followers=0,following=0,vids=[];
 if(db){
  try{
   const a=await Promise.all([
    db.from("follows").select("*",{count:"exact",head:true}).eq("following_id",currentUser.id),
    db.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",currentUser.id),
    db.from("videos").select("id,video_url,thumbnail_url,views").eq("user_id",currentUser.id).order("created_at",{ascending:false})
   ]);followers=a[0].count||0;following=a[1].count||0;vids=a[2].data||[];
  }catch(e){}
 }
 el.innerHTML=`<div class="profile-head"><img class="profile-big" src="${esc(p.avatar_url||"")}"><h2>@${esc(p.username||"user")}</h2><div class="muted">${esc(p.full_name||"RIVO Creator")}</div><p>${esc(p.bio||"Share your moments on RIVO ✨")}</p><div class="stats"><div class="stat"><b>${format(following)}</b><span>Following</span></div><div class="stat"><b>${format(followers)}</b><span>Followers</span></div><div class="stat"><b>${format(vids.length)}</b><span>Videos</span></div></div><button class="edit" id="editProfileBtn">Edit Profile</button> <button class="edit" onclick="screen('settingsScreen')">⚙ Settings</button></div><div class="grid">${vids.map(v=>`<div class="tile"><video src="${esc(v.video_url)}" muted preload="metadata"></video><span>▶ ${format(v.views)}</span></div>`).join("")||'<div class="empty" style="grid-column:1/-1">No videos yet. Tap + to upload.</div>'}</div>`;
 $("editProfileBtn").onclick=()=>{ $("editUsername").value=p.username||"";$("editFullName").value=p.full_name||"";$("editBio").value=p.bio||"";$("editAvatar").value=p.avatar_url||"";modal("editProfileModal")};
}
$("saveProfile").onclick=async()=>{if(!currentUser)return;const username=$("editUsername").value.trim();if(!username){toast("Username দিন");return}const r=await db.from("profiles").update({username,full_name:$("editFullName").value.trim(),bio:$("editBio").value.trim(),avatar_url:$("editAvatar").value.trim()}).eq("id",currentUser.id);if(r.error)toast(r.error.message);else{toast("Profile updated");modal("editProfileModal",false);await ensureProfile(currentUser);renderProfile()}}

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>modal(b.dataset.close,false));
document.querySelectorAll(".navbtn[data-screen]").forEach(b=>b.onclick=()=>screen(b.dataset.screen));
$("uploadBtn").onclick=()=>{if(!currentUser){modal("authModal");return}modal("uploadModal")};
$("searchBtn").onclick=()=>screen("discoverScreen");
document.querySelectorAll("[data-feedtab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-feedtab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");toast(b.dataset.feedtab==="following"?"Following feed coming next":"For You")});

$("authToggle").onclick=()=>{authSignup=!authSignup;$("authTitle").textContent=authSignup?"Create your RIVO account":"Welcome to RIVO";$("authName").style.display=authSignup?"block":"none";$("authHint").textContent=authSignup?"Already have an account?":"Don't have an account?";$("authToggle").textContent=authSignup?"Sign in":"Sign up"};
$("authSubmit").onclick=async()=>{
 const email=$("authEmail").value.trim(),pass=$("authPassword").value;if(!email||!pass){toast("Email ও password দিন");return}
 $("authSubmit").disabled=true;
 if(authSignup){
   const r=await db.auth.signUp({email,password:pass});if(r.error)toast(r.error.message);else{currentUser=r.data.user;if(currentUser){await ensureProfile(currentUser);if($("authName").value.trim())await db.from("profiles").update({username:$("authName").value.trim()}).eq("id",currentUser.id)}toast("Account created");modal("authModal",false);loadFeed();renderProfile()}
 }else{
   const r=await db.auth.signInWithPassword({email,password:pass});if(r.error)toast(r.error.message);else{currentUser=r.data.user;await ensureProfile(currentUser);modal("authModal",false);loadFeed();renderProfile()}
 }
 $("authSubmit").disabled=false;
}
$("discoverInput").oninput=async e=>{
 const q=e.target.value.trim().toLowerCase();if(!q){$("discoverResults").innerHTML="";return}
 const {data:ps}=await db.from("profiles").select("id,username,full_name,avatar_url,bio").ilike("username","%"+q+"%").limit(20);
 $("discoverResults").innerHTML=(ps||[]).map(p=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #252630"><img class="avatar" src="${esc(p.avatar_url||"")}"><div><b>@${esc(p.username)}</b><div class="muted">${esc(p.full_name||"")}</div></div></div>`).join("")||'<div class="empty">No users found.</div>';
};


function renderSettings(){}
function showAccount(){screen("profileScreen");toast("Account settings are in your Profile");}
function showPrivacy(){toast("Privacy controls are being prepared");}
function showNotifications(){toast("Notifications are being prepared");}
function toggleTheme(){document.body.classList.toggle("light");toast("Appearance changed");}
db?.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(currentUser)await ensureProfile(currentUser);});
init();
</script>
</body>
</html>
